version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.netronome.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: netronome

build:
  toolchains: []
  run_buildscript: false

images:
  - id: netronome
    target: service
    service: netronome
    source: ghcr.io/autobrr/netronome
    channel: stable
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    delivery:
      mode: mirror
      require_digest_match: true

stores:
  official:
    enabled: false
    skip_if_version_exists: false
    retry:
      enabled: false
  private:
    enabled: true
    skip_if_version_exists: true
    name: Netronome
    summary: Published from GitHub Actions
